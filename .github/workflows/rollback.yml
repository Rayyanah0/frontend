name: Roll back production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to redeploy (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        id: image
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v1.2.3" >&2
            exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/deploy-container
        with:
          image: ${{ steps.image.outputs.image }}
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          registry_username: ${{ secrets.REGISTRY_USERNAME }}
          registry_token: ${{ secrets.REGISTRY_TOKEN }}
          api_url: ${{ vars.NEXT_PUBLIC_API_URL }}
          stellar_network: ${{ vars.NEXT_PUBLIC_STELLAR_NETWORK }}
          testnet_contract_id: ${{ vars.NEXT_PUBLIC_STELLAR_TESTNET_CONTRACT_ID }}
          mainnet_contract_id: ${{ vars.NEXT_PUBLIC_STELLAR_MAINNET_CONTRACT_ID }}
          app_port: ${{ vars.APP_PORT || '3000' }}