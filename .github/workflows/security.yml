name: Security

# Supply-chain and content-security gates. Threat model and the purpose of
# each job: SECURITY.md.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, so newly published advisories fail fast even without code changes.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: lockfile-lint (registry, https, integrity, names)
        run: npx --yes lockfile-lint@4.14.0 --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity --validate-package-names --empty-hostname false

      - name: Lockfile is in sync with package.json (npm ci only)
        # `npm ci` refuses to run when package.json and package-lock.json disagree.
        run: npm ci --ignore-scripts --dry-run

      - name: No `npm install` in CI / Docker
        run: |
          if grep -RInE '\bnpm (install|i)\b' .github/workflows .github/actions Dockerfile 2>/dev/null | grep -v 'security.yml'; then
            echo "::error::Use 'npm ci' (lockfile-exact) instead of 'npm install' in CI and images."
            exit 1
          fi

      - name: Flag lockfile-only changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if echo "$changed" | grep -qx 'package-lock.json' && ! echo "$changed" | grep -qx 'package.json'; then
            if echo ",$LABELS," | grep -q ',lockfile-only-change,'; then
              echo "::warning::package-lock.json changed without package.json — allowed by the 'lockfile-only-change' label. Review resolved URLs and integrity hashes."
            else
              echo "::error file=package-lock.json::package-lock.json changed without a package.json change. This is how lockfile-injection attacks look. If intentional (e.g. lock maintenance), a maintainer must add the 'lockfile-only-change' label after reviewing the diff."
              exit 1
            fi
          fi

  audit:
    name: Dependency audit (npm audit + OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit report
        run: npm audit --json > npm-audit.json || true
      - name: Audit gate (high/critical, with reviewed exceptions)
        run: node scripts/security/audit-gate.mjs --audit-json npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: npm-audit.json

  osv:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install osv-scanner
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          chmod +x osv-scanner
      - name: Scan lockfile
        # Second, independent advisory source (OSV aggregates GHSA + ecosystem DBs).
        # Ignored ids live in osv-scanner.toml with a reason and an expiry.
        run: ./osv-scanner scan source --lockfile package-lock.json --config osv-scanner.toml

  install-scripts:
    name: Install-script policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Every package with install scripts is explicitly allowlisted
        # allow-scripts fails when a dependency has lifecycle scripts that are
        # not listed in package.json "lavamoat.allowScripts", then runs only the
        # ones set to true.
        run: npx allow-scripts

  licenses:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: node scripts/security/check-licenses.mjs

  xss-corpus:
    name: XSS corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npx allow-scripts
      - name: Run every renderer against the payload corpus
        run: npx jest src/components/__tests__/xss.corpus.test.tsx --ci --json --outputFile=xss-corpus-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xss-corpus-results
          path: xss-corpus-results.json

  lint-security:
    name: Security lint rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npx allow-scripts
      - run: npx next lint --max-warnings 0
