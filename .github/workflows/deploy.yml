name: Deploy release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_STELLAR_NETWORK=${{ vars.NEXT_PUBLIC_STELLAR_NETWORK }}
            NEXT_PUBLIC_STELLAR_TESTNET_CONTRACT_ID=${{ vars.NEXT_PUBLIC_STELLAR_TESTNET_CONTRACT_ID }}
            NEXT_PUBLIC_STELLAR_MAINNET_CONTRACT_ID=${{ vars.NEXT_PUBLIC_STELLAR_MAINNET_CONTRACT_ID }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.version }}
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-container
        with:
          image: ${{ needs.build.outputs.image }}
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          registry_username: ${{ secrets.REGISTRY_USERNAME }}
          registry_token: ${{ secrets.REGISTRY_TOKEN }}
          api_url: ${{ vars.NEXT_PUBLIC_API_URL }}
          stellar_network: ${{ vars.NEXT_PUBLIC_STELLAR_NETWORK }}
          testnet_contract_id: ${{ vars.NEXT_PUBLIC_STELLAR_TESTNET_CONTRACT_ID }}
          mainnet_contract_id: ${{ vars.NEXT_PUBLIC_STELLAR_MAINNET_CONTRACT_ID }}
          app_port: ${{ vars.APP_PORT || '3000' }}

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-container
        with:
          image: ${{ needs.build.outputs.image }}
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          registry_username: ${{ secrets.REGISTRY_USERNAME }}
          registry_token: ${{ secrets.REGISTRY_TOKEN }}
          api_url: ${{ vars.NEXT_PUBLIC_API_URL }}
          stellar_network: ${{ vars.NEXT_PUBLIC_STELLAR_NETWORK }}
          testnet_contract_id: ${{ vars.NEXT_PUBLIC_STELLAR_TESTNET_CONTRACT_ID }}
          mainnet_contract_id: ${{ vars.NEXT_PUBLIC_STELLAR_MAINNET_CONTRACT_ID }}
          app_port: ${{ vars.APP_PORT || '3000' }}