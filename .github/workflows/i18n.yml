name: i18n

on:
  pull_request:
    paths: ["messages/**", "src/**", "scripts/i18n-check.mjs"]
  push:
    branches: [main]

jobs:
  catalogs:
    name: Message catalogs complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Dependency-free: the check only reads messages/*.json.
      - run: node scripts/i18n-check.mjs
